
name: Validate

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - name: Install development dependencies
        run: >-
          python -m pip install
          homeassistant==2026.9.2
          ruff==0.16.7
          mypy==2.3.1
      - name: Compile
        run: python -m compileall custom_components tests
      - name: Test
        run: pytest
      - name: Ruff format
        run: ruff format --check custom_components tests
      - name: Ruff lint
        run: ruff check custom_components tests
      - name: Mypy
        run: mypy custom_components tests
      - name: Markdown lint
        run: |
          sudo apt-get update
          sudo apt-get install --yes markdownlint
          mdl README.md CHANGELOG.md CONTRIBUTING.md info.md

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run hassfest
        uses: home-assistant/actions/hassfest@master

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: HACS validation
        uses: hacs/action@main
        with:
          category: "integration"
