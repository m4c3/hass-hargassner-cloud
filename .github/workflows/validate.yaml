
name: Validate

permissions: read-all

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          cache: pip
      - name: Install development dependencies
        run: python -m pip install --requirement requirements-dev.txt
      - name: Compile
        run: python -m compileall custom_components tests scripts
      - name: Validate JSON
        run: |
          python -m json.tool hacs.json >/dev/null
          python -m json.tool custom_components/hargassner_cloud/manifest.json >/dev/null
          python -m json.tool custom_components/hargassner_cloud/strings.json >/dev/null
          for translation in custom_components/hargassner_cloud/translations/*.json; do
            python -m json.tool "$translation" >/dev/null
          done
      - name: Test
        run: PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 pytest
      - name: Ruff format
        run: ruff format --check custom_components tests scripts
      - name: Ruff lint
        run: ruff check custom_components tests scripts
      - name: Mypy
        run: mypy custom_components tests scripts
      - name: Markdown lint
        run: |
          sudo apt-get update
          sudo apt-get install --yes markdownlint
          mdl README*.md CHANGELOG.md CONTRIBUTING.md SECURITY.md info.md AGENTS.md

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run hassfest
        uses: home-assistant/actions/hassfest@86d4564712fa02543c808e3a693dd04f9d3f8361

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: HACS validation
        # Temporary workaround for https://github.com/hacs/integration/issues/5497.
        continue-on-error: true
        uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa
        with:
          category: "integration"
