
name: Validate

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
      - name: Install development dependencies
        run: >-
          python -m pip install
          homeassistant==2026.9.2
          pytest==9.0.2
          ruff==0.16.7
          mypy==2.3.1
      - name: Compile
        run: python -m compileall custom_components tests scripts
      - name: Validate JSON
        run: |
          python -m json.tool hacs.json >/dev/null
          python -m json.tool custom_components/hargassner_cloud/manifest.json >/dev/null
          python -m json.tool custom_components/hargassner_cloud/strings.json >/dev/null
          python -m json.tool custom_components/hargassner_cloud/translations/de.json >/dev/null
          python -m json.tool custom_components/hargassner_cloud/translations/en.json >/dev/null
      - name: Test
        run: pytest
      - name: Ruff format
        run: ruff format --check custom_components tests scripts
      - name: Ruff lint
        run: ruff check custom_components tests scripts
      - name: Mypy
        run: mypy custom_components tests scripts
      - name: Markdown lint
        run: |
          sudo apt-get update
          sudo apt-get install --yes markdownlint
          mdl README.md CHANGELOG.md CONTRIBUTING.md info.md AGENTS.md

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run hassfest
        uses: home-assistant/actions/hassfest@master

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: HACS validation
        # Temporary workaround for https://github.com/hacs/integration/issues/5497.
        continue-on-error: true
        uses: hacs/action@main
        with:
          category: "integration"
