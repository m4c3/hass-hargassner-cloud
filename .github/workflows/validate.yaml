
name: Validate

permissions: read-all

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
      - name: Install development dependencies
        run: python -m pip install --requirement requirements-dev.txt
      - name: Compile
        run: python -m compileall custom_components tests scripts
      - name: Validate JSON
        run: |
          python -m json.tool hacs.json >/dev/null
          python -m json.tool custom_components/hargassner_cloud/manifest.json >/dev/null
          python -m json.tool custom_components/hargassner_cloud/strings.json >/dev/null
          python -m json.tool custom_components/hargassner_cloud/translations/de.json >/dev/null
          python -m json.tool custom_components/hargassner_cloud/translations/en.json >/dev/null
      - name: Test
        run: pytest
      - name: Ruff format
        run: ruff format --check custom_components tests scripts
      - name: Ruff lint
        run: ruff check custom_components tests scripts
      - name: Mypy
        run: mypy custom_components tests scripts
      - name: Markdown lint
        run: |
          sudo apt-get update
          sudo apt-get install --yes markdownlint
          mdl README.md CHANGELOG.md CONTRIBUTING.md SECURITY.md info.md AGENTS.md

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run hassfest
        uses: home-assistant/actions/hassfest@58bff37c8947f690ace498be413a9b78d6f30f93

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: HACS validation
        # Temporary workaround for https://github.com/hacs/integration/issues/5497.
        continue-on-error: true
        uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa
        with:
          category: "integration"
